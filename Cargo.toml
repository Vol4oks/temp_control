[package]
name = "temp_control"
version = "0.1.0"
authors = ["Vol4oks <dima.voh99@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "temp_control"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.53", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp-idf-hal = "0.47.0"
ssd1306 = "0.10.0"
embedded-graphics = "0.8.2"
embedded-dht-rs = { version = "0.5.0", features = ["dht11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
anyhow = "1.0.104"
embedded-svc = "0.29"

[build-dependencies]
embuild = "0.33.5"
